[project]
name = "git-annex-duplicates"
version = "0.1.0"
description = "Find duplicate files in a git-annex repository"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
]

[tool.uv]
package = true

[project.scripts]
git-annex-duplicates = "git_annex_duplicates:main"
