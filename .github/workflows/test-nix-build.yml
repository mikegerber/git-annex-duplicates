name: "Test nix-build"

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-26.05
    - run: nix-build
